name: 5. API Tests

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'The API Gateway Invoke URL (e.g. https://abc.execute-api.us-east-1.amazonaws.com)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run Tests
        run: |
          URL=${{ github.event.inputs.api_url }}
          echo "Testing API at $URL"

          # 1. Create
          echo "Creating item..."
          curl -s -X "PUT" -H "Content-Type: application/json" -d '{"id": "test-1", "price": 100, "name": "Test Item"}' $URL/items
          echo ""

          # 2. Get All
          echo "Getting all items..."
          curl -s $URL/items
          echo ""

          # 3. Get One
          echo "Getting item test-1..."
          curl -s $URL/items/test-1
          echo ""

          # 4. Delete
          echo "Deleting item test-1..."
          curl -s -X "DELETE" $URL/items/test-1
          echo ""
