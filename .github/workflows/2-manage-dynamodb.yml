name: 2. Manage DynamoDB

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (deploy/delete)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - delete

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TABLE_NAME: http-crud-tutorial-items

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy DynamoDB
        if: github.event.inputs.action == 'deploy'
        run: |
          aws dynamodb create-table \
            --table-name ${{ env.TABLE_NAME }} \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: Delete DynamoDB
        if: github.event.inputs.action == 'delete'
        run: |
          aws dynamodb delete-table --table-name ${{ env.TABLE_NAME }}
